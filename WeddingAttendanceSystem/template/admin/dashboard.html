<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>礼金与数据看板 - 婚礼后台管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FDFBF7] text-[#2C2A29] font-sans antialiased">
  <div id="root"></div>
  <script src="../wedding.js"></script>
  <script type="text/babel">
    const { useState, useMemo } = React;

    function DashboardApp() {
      const [angpaoRecords, setAngpaoRecords] = useState(INITIAL_ANGPAO);
      const [guests] = useState(INITIAL_GUESTS);

      const totalAngpaoRM = useMemo(() => {
        return angpaoRecords.filter(r => !r.isVoided).reduce((acc, curr) => acc + curr.amount, 0);
      }, [angpaoRecords]);

      const arrivedCount = guests.filter(g => g.isActive && g.status === 'ARRIVED').length;

      return (
        <div className="min-h-screen bg-[#FDFBF7] text-[#2C2A29] font-sans flex flex-col">
          <header className="sticky top-0 z-35 bg-[#FFFDF9]/95 backdrop-blur-md border-b border-[#E8E2D5] shadow-xs">
            <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-full bg-gradient-to-br from-amber-600 to-amber-700 text-white flex items-center justify-center font-serif text-lg font-bold">囍</div>
                <div>
                  <h1 className="text-base font-bold text-[#2C2A29]">婚礼后台管理</h1>
                  <p className="text-xs text-[#78716C]">数据总览与礼金汇总看板</p>
                </div>
              </div>
              <nav className="flex items-center gap-1 bg-[#FAF7F2] p-1 rounded-xl border border-[#E8E2D5] text-xs font-semibold">
                <a href="../mainpage.html" className="px-3 py-1.5 rounded-lg text-[#57534E] hover:bg-[#F2ECE1]">签到主页</a>
                <a href="dashboard.html" className="px-3 py-1.5 rounded-lg bg-amber-700 text-white shadow-xs">数据看板</a>
                <a href="tag.html" className="px-3 py-1.5 rounded-lg text-[#57534E] hover:bg-[#F2ECE1]">标签管理</a>
                <a href="add-guest.html" className="px-3 py-1.5 rounded-lg text-[#57534E] hover:bg-[#F2ECE1]">新增宾客</a>
                <a href="table-setting.html" className="px-3 py-1.5 rounded-lg text-[#57534E] hover:bg-[#F2ECE1]">桌位设置</a>
              </nav>
            </div>
          </header>

          <main className="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-amber-50 p-5 rounded-2xl border border-amber-200 shadow-sm space-y-2">
                <h3 className="text-xs font-bold text-amber-900 flex items-center gap-1.5">
                  <i className="fa-solid fa-gift text-amber-700 text-base"></i> 礼金总金额汇总 (RM)
                </h3>
                <p className="text-3xl font-extrabold text-amber-900">{formatRM(totalAngpaoRM)}</p>
                <p className="text-xs text-amber-700">共 {angpaoRecords.filter(r => !r.isVoided).length} 笔有效礼金记录登记</p>
              </div>

              <div className="bg-emerald-50 p-5 rounded-2xl border border-emerald-200 shadow-sm space-y-2">
                <h3 className="text-xs font-bold text-emerald-900 flex items-center gap-1.5">
                  <i className="fa-solid fa-user-check text-emerald-700 text-base"></i> 宾客签到统计
                </h3>
                <p className="text-3xl font-extrabold text-emerald-900">{arrivedCount} / {guests.length} 人</p>
                <p className="text-xs text-emerald-700">实时出席率同步更新</p>
              </div>
            </div>

            <div className="bg-white rounded-2xl border border-[#E8E2D5] p-5 shadow-xs space-y-4">
              <h3 className="font-bold text-base text-[#2C2A29]">礼金明细流水审计</h3>
              <div className="space-y-2 text-xs">
                {angpaoRecords.map(r => (
                  <div key={r.id} className="p-3 bg-[#FAF8F5] border border-[#E8E2D5] rounded-xl flex items-center justify-between">
                    <div>
                      <span className="font-bold text-sm text-[#2C2A29]">{r.recipientName}</span>
                      <span className="text-[#78716C] ml-2">({r.recipientType === 'FAMILY' ? '家庭礼金' : '个人礼金'})</span>
                      <p className="text-[#78716C] mt-0.5">登记人: {r.recordedBy} | 时间: {r.recordedAt}</p>
                    </div>
                    <div className="text-right">
                      <span className="text-base font-extrabold text-amber-800">{formatRM(r.amount)}</span>
                      {r.isVoided && <p className="text-red-600 font-bold">已作废</p>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<DashboardApp />);
  </script>
</body>
</html>
