<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>婚礼宾客签到与礼金管理系统</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Font Awesome 6 Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="dashboard" data-base="../" class="wedding-bg-hex-FDFBF7 wedding-text-hex-2C2A29 wedding-font-sans wedding-antialiased wedding-selection-bg-amber-100">
<div class="wedding-min-h-screen wedding-bg-hex-FDFBF7 wedding-text-hex-2C2A29 wedding-font-sans d-flex flex-column wedding-selection-bg-amber-100" id="application">
<header class="position-sticky wedding-top-0 wedding-z-30 wedding-bg-hex-FFFDF9-95 wedding-backdrop-blur-md wedding-border-b wedding-border-hex-E8E2D5 ">
<div class="wedding-max-w-4xl wedding-mx-auto wedding-px-4 wedding-py-3 d-flex align-items-center justify-content-between">
<div class="d-flex align-items-center wedding-gap-2-5">
<div class="wedding-w-9 wedding-h-9 wedding-rounded-full wedding-bg-gradient-to-br wedding-from-amber-600 wedding-to-amber-700 wedding-text-white d-flex align-items-center justify-content-center wedding-font-serif wedding-text-lg wedding-font-bold ">囍</div>
<div>
<h1 class="wedding-text-base wedding-font-bold wedding-text-hex-2C2A29 wedding-leading-tight">婚礼宾客签到与礼金管理系统</h1>
<p class="wedding-text-xs wedding-text-hex-78716C d-flex align-items-center wedding-gap-1-5 wedding-mt-0-5" data-field="current-user">
<span class="d-inline-block wedding-w-1-5 wedding-h-1-5 wedding-rounded-full wedding-bg-emerald-500">
</span>接待员 - 阿杰 (管理员)</p>
</div>
</div>
<div class="d-flex align-items-center wedding-gap-2">
<a class="wedding-text-xs wedding-font-medium wedding-px-3 wedding-py-1-5 wedding-rounded-lg wedding-border wedding-transition-all d-flex align-items-center wedding-gap-1-5 wedding-bg-amber-700 wedding-text-white wedding-border-amber-700 " href="../mainpage.html">
<i class="fa-solid fa-user-check">
</i>
<span>返回签到主页</span>
</a>
<button class="wedding-p-1-5 wedding-text-hex-78716C wedding-hover-text-red-700 wedding-hover-bg-red-50 wedding-rounded-lg wedding-transition-colors" title="退出登录" data-action="logout">
<i class="fa-solid fa-right-from-bracket">
</i>
</button>
</div>
</div>
</header>
<main class="wedding-flex-1 wedding-max-w-4xl w-100 wedding-mx-auto wedding-p-3 wedding-md-p-6">
<div class="wedding-bg-white wedding-rounded-2xl wedding-border wedding-border-hex-E8E2D5  overflow-hidden">
<div class="d-flex wedding-border-b wedding-border-hex-E8E2D5 wedding-bg-hex-FAF7F2 wedding-overflow-x-auto" aria-label="后台导航">
<a class="wedding-flex-1 wedding-min-w-100px wedding-py-3 wedding-text-xs wedding-font-bold d-flex align-items-center justify-content-center wedding-gap-1-5 wedding-bg-white wedding-text-amber-900 wedding-border-b-2 wedding-border-amber-700" href="../admin/dashboard.html" aria-current="page">
<i class="fa-solid fa-chart-pie">
</i>
<span>仪表盘</span>
</a>
<a class="wedding-flex-1 wedding-min-w-100px wedding-py-3 wedding-text-xs wedding-font-bold wedding-transition-colors d-flex align-items-center justify-content-center wedding-gap-1-5 wedding-text-hex-78716C" href="../admin/tag.html">
<i class="fa-solid fa-tag wedding-text-amber-700">
</i>
<span>全局标签管理</span>
</a>
<a class="wedding-flex-1 wedding-min-w-100px wedding-py-3 wedding-text-xs wedding-font-bold wedding-transition-colors d-flex align-items-center justify-content-center wedding-gap-1-5 wedding-text-hex-78716C" href="../admin/add-guest.html">
<i class="fa-solid fa-user">
</i>
<span>新增/管理宾客</span>
</a>
<a class="wedding-flex-1 wedding-min-w-100px wedding-py-3 wedding-text-xs wedding-font-bold wedding-transition-colors d-flex align-items-center justify-content-center wedding-gap-1-5 wedding-text-hex-78716C" href="../admin/table-setting.html">
<i class="fa-solid fa-table-cells">
</i>
<span>桌位设置</span>
</a>
</div>
<div class="wedding-p-4 wedding-md-p-6 wedding-space-y-6">
<div class="admin-summary-grid">
<div class="wedding-bg-emerald-100 wedding-p-4 wedding-rounded-xl wedding-border wedding-border-emerald-100">
<h3 class="wedding-text-xs wedding-font-bold wedding-text-emerald-800">全场出席进度 (Arrived / Total)</h3>
<p class="wedding-text-lg wedding-font-extrabold wedding-text-emerald-900" data-field="attendance">2 / 8 人</p>
</div>
<div class="wedding-bg-amber-50 wedding-p-4 wedding-rounded-xl wedding-border wedding-border-amber-200 wedding-space-y-1">
<h4 class="wedding-text-xs wedding-font-bold wedding-text-amber-900 d-flex align-items-center wedding-gap-1-5">
<i class="fa-solid fa-gift wedding-text-amber-700">
</i> 后台礼金汇总统计 (仅管理员可见)</h4>
<p class="wedding-text-2xl wedding-font-extrabold wedding-text-amber-900 wedding-pt-1" data-field="gift-total">RM 1,100.00</p>
<p class="wedding-text-11px wedding-text-amber-700" data-field="gift-count">共 2 笔有效礼金记录</p>
</div>
</div>

<section class="admin-section" aria-labelledby="dashboard-guests-title">
  <h2 id="dashboard-guests-title" class="admin-section-title"><i class="fa-solid fa-list" aria-hidden="true"></i> 宾客与礼金</h2>
  <label class="admin-search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span class="visually-hidden">搜索姓名、家庭或桌号</span><input id="dashboard-search" type="search" class="admin-input" placeholder="搜索姓名 / 家庭 / 桌号"></label>
  <div class="admin-table-scroll" tabindex="0" role="region" aria-label="宾客个人礼金列表">
    <table class="admin-table"><thead><tr><th scope="col">姓名</th><th scope="col">婚礼边</th><th scope="col">桌号</th><th scope="col">签到状态</th><th scope="col">个人礼金</th><th scope="col">操作</th></tr></thead><tbody id="dashboard-guest-list"></tbody></table>
  </div>
  <p id="dashboard-guests-empty" class="admin-empty" hidden>未找到匹配的宾客。</p>
</section>
<p class="admin-gift-breakdown" id="gift-breakdown" aria-live="polite"></p>

</div>
</div>
</main>
</div>
<div id="login-view" hidden>
</div>
<div id="modal-root">
</div>
<div id="toast" role="status" hidden class="position-fixed wedding-top-4 wedding-left-1-2 wedding--translate-x-1-2 wedding-z-50 wedding-bg-hex-322F2B wedding-text-white wedding-text-xs wedding-md-text-sm wedding-px-4 wedding-py-2-5 wedding-rounded-full wedding-shadow-lg wedding-border wedding-border-amber-500-30">
<i class="fa-solid fa-circle-check wedding-text-amber-400">
</i> <span>
</span>
</div>
<template id="login-template">
<div class="wedding-min-h-screen wedding-bg-hex-FDFBF7 d-flex align-items-center justify-content-center wedding-p-4">
<div class="wedding-bg-white wedding-p-6 wedding-rounded-2xl wedding-border wedding-border-hex-E8E2D5 wedding-shadow-md wedding-max-w-sm w-100 wedding-space-y-4 text-center">
<div class="wedding-w-12 wedding-h-12 wedding-rounded-full wedding-bg-amber-700 wedding-text-white d-flex align-items-center justify-content-center wedding-mx-auto wedding-text-xl wedding-font-bold wedding-font-serif">囍</div>
<h2 class="wedding-text-lg wedding-font-bold wedding-text-hex-2C2A29">婚礼宾客签到系统登录</h2>
<button class="w-100 wedding-py-2-5 wedding-bg-amber-700 wedding-text-white wedding-rounded-xl wedding-font-bold wedding-hover-bg-amber-800 wedding-transition-colors" data-action="login">以管理员登录体验</button>
</div>
</div>
</template>

<template id="dashboard-guest-row">
  <tr><td><strong data-field="name"></strong><small data-field="family" class="admin-subtext"></small></td><td><span data-field="side" class="admin-badge"></span></td><td data-field="table"></td><td><span data-field="status" class="admin-badge"></span></td><td data-field="amount" class="admin-money"></td><td><div class="admin-row-actions"><button type="button" class="admin-outline-button" data-action="admin-guest-history">个人明细</button><button type="button" class="admin-outline-button" data-action="admin-family-history" hidden>家庭礼金</button></div></td></tr>
</template>
<template id="history-record-valid">
<div class="wedding-p-3 wedding-rounded-xl wedding-border wedding-bg-hex-FAF8F5 wedding-border-hex-E8E2D5" data-record="">
<div class="d-flex align-items-center justify-content-between">
<span class="wedding-font-bold wedding-text-hex-2C2A29" data-field="record-name">个人礼金 - 陈美玲</span>
<button class="wedding-text-red-600 wedding-hover-underline wedding-font-semibold" data-action="void-record">作废</button>
</div>
<p class="wedding-text-xs wedding-text-hex-78716C wedding-mt-1" data-field="record-meta">登记人: 工作人员 阿杰 | 时间: 2026-11-06 18:16</p>
<p class="wedding-text-xs wedding-text-amber-800 wedding-mt-1" data-field="record-notes">备注: 备注</p>
</div>
</template>
<template id="history-record-voided">
<div class="wedding-p-3 wedding-rounded-xl wedding-border wedding-bg-gray-50 wedding-border-gray-200 wedding-opacity-60" data-record="">
<div class="d-flex align-items-center justify-content-between">
<span class="wedding-font-bold wedding-text-hex-2C2A29" data-field="record-name">个人礼金 - 陈美玲</span>
</div>
<p class="wedding-text-xs wedding-text-hex-78716C wedding-mt-1" data-field="record-meta">登记人: 工作人员 阿杰 | 时间: 2026-11-06 18:16</p>
<p class="wedding-text-xs wedding-text-amber-800 wedding-mt-1" data-field="record-notes">备注: 备注</p>
<p class="wedding-text-xs wedding-text-red-600 wedding-font-bold wedding-mt-1" data-field="record-void-reason">【已作废】原因: 原因</p>
</div>
</template>
<template id="history-modal-template">
<div class="position-fixed wedding-inset-0 wedding-z-50 wedding-bg-black-60  d-flex align-items-center justify-content-center wedding-p-4" role="dialog" aria-modal="true" aria-label="【宾客姓名】礼金记录明细" tabindex="-1">
<div class="wedding-bg-white wedding-rounded-2xl wedding-max-w-md w-100 wedding-p-5 wedding-space-y-4 wedding-border wedding-border-hex-E8E2D5 wedding-shadow-xl wedding-max-h-85vh wedding-overflow-y-auto">
<div class="d-flex align-items-center justify-content-between wedding-border-b wedding-border-hex-F0EBE1 wedding-pb-3">
<h3 class="wedding-text-base wedding-font-bold wedding-text-hex-2C2A29" data-field="history-title">【宾客姓名】礼金记录明细</h3>
<button class="wedding-p-1 wedding-text-hex-A8A29E wedding-hover-text-hex-2C2A29" data-action="close-modal">
<i class="fa-solid fa-xmark">
</i>
</button>
</div>
<div class="wedding-space-y-2 wedding-text-xs" data-field="history-records">
</div>
</div>
</div>
</template>
<template id="void-modal-template">
<div class="position-fixed wedding-inset-0 wedding-z-50 wedding-bg-black-60  d-flex align-items-center justify-content-center wedding-p-4" role="dialog" aria-modal="true" aria-label="确认作废此礼金记录？" tabindex="-1">
<div class="wedding-bg-white wedding-rounded-2xl wedding-max-w-sm w-100 wedding-p-5 wedding-space-y-4 wedding-border wedding-border-hex-E8E2D5 wedding-shadow-xl">
<div class="d-flex align-items-center wedding-gap-3 wedding-text-red-600">
<div class="wedding-p-2 wedding-bg-red-100 wedding-rounded-full">
<i class="fa-solid fa-triangle-exclamation">
</i>
</div>
<h3 class="wedding-text-base wedding-font-bold wedding-text-hex-2C2A29">确认作废此礼金记录？</h3>
</div>
<p class="wedding-text-xs wedding-text-hex-78716C wedding-leading-relaxed">财务记录无法直接物理删除。作废后该笔礼金将不计入总额，并生成审计留痕。</p>
<div>
<label class="d-block wedding-text-xs wedding-font-semibold wedding-text-hex-44403C wedding-mb-1">作废原因 (必填)</label>
<input type="text" placeholder="例如：金额登记错误 / 重复录入" class="w-100 wedding-px-3 wedding-py-2 wedding-bg-hex-FAF8F5 wedding-border wedding-border-hex-D6CEC2 wedding-rounded-xl wedding-text-xs wedding-focus-outline-none wedding-focus-border-amber-600" value="" name="voidReason" required="">
</div>
<div class="d-flex align-items-center wedding-gap-2 wedding-pt-2">
<button class="wedding-flex-1 wedding-py-2-5 wedding-border wedding-border-hex-D6CEC2 wedding-rounded-xl wedding-text-xs wedding-font-medium wedding-text-hex-57534E wedding-hover-bg-hex-F5F2EA" data-action="close-modal">取消</button>
<button class="wedding-flex-1 wedding-py-2-5 wedding-bg-red-600 wedding-hover-bg-red-700 wedding-text-white wedding-rounded-xl wedding-text-xs wedding-font-medium " data-action="confirm-void">确认作废</button>
</div>
</div>
</div>
</template>
<script src="../wedding.js" defer>
</script>
</body>
</html>
