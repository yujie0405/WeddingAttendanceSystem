<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>标签管理 - 婚礼后台管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FDFBF7] text-[#2C2A29] font-sans antialiased">
  <div id="root"></div>
  <script src="../wedding.js"></script>
  <script type="text/babel">
    const { useState } = React;

    function TagApp() {
      const [tags, setTags] = useState(INITIAL_TAGS);
      const [newTagName, setNewTagName] = useState('');
      const [toast, setToast] = useState(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const handleCreateTag = (e) => {
        e.preventDefault();
        if (!newTagName.trim()) return;
        const colors = [
          'bg-amber-100 text-amber-900 border-amber-300',
          'bg-blue-100 text-blue-900 border-blue-300',
          'bg-emerald-100 text-emerald-900 border-emerald-300',
          'bg-purple-100 text-purple-900 border-purple-300',
        ];
        const newTag = {
          id: `tag-${Date.now()}`,
          name: newTagName.trim(),
          color: colors[tags.length % colors.length]
        };
        setTags([...tags, newTag]);
        showToast(`标签 [${newTag.name}] 创建成功`);
        setNewTagName('');
      };

      const handleDeleteTag = (id, name) => {
        if (confirm(`确定删除标签 [${name}] 吗？`)) {
          setTags(tags.filter(t => t.id !== id));
          showToast(`已删除标签 [${name}]`);
        }
      };

      return (
        <div className="min-h-screen bg-[#FDFBF7] text-[#2C2A29] font-sans flex flex-col">
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-[#322F2B] text-white text-xs px-4 py-2.5 rounded-full shadow-lg">
              {toast}
            </div>
          )}
          <header className="sticky top-0 z-35 bg-[#FFFDF9]/95 backdrop-blur-md border-b border-[#E8E2D5] shadow-xs">
            <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-full bg-gradient-to-br from-amber-600 to-amber-700 text-white flex items-center justify-center font-serif text-lg font-bold">囍</div>
                <h1 className="text-base font-bold text-[#2C2A29]">全局标签管理</h1>
              </div>
              <nav className="flex items-center gap-1 bg-[#FAF7F2] p-1 rounded-xl border border-[#E8E2D5] text-xs font-semibold">
                <a href="../mainpage.html" className="px-3 py-1.5 rounded-lg text-[#57534E] hover:bg-[#F2ECE1]">签到主页</a>
                <a href="dashboard.html" className="px-3 py-1.5 rounded-lg text-[#57534E] hover:bg-[#F2ECE1]">数据看板</a>
                <a href="tag.html" className="px-3 py-1.5 rounded-lg bg-amber-700 text-white shadow-xs">标签管理</a>
                <a href="add-guest.html" className="px-3 py-1.5 rounded-lg text-[#57534E] hover:bg-[#F2ECE1]">新增宾客</a>
                <a href="table-setting.html" className="px-3 py-1.5 rounded-lg text-[#57534E] hover:bg-[#F2ECE1]">桌位设置</a>
              </nav>
            </div>
          </header>

          <main className="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 space-y-6">
            <div className="bg-white rounded-2xl border border-[#E8E2D5] p-5 shadow-xs space-y-4">
              <h3 className="font-bold text-base text-[#2C2A29]">添加新标签</h3>
              <form onSubmit={handleCreateTag} className="flex gap-2">
                <input
                  type="text"
                  value={newTagName}
                  onChange={e => setNewTagName(e.target.value)}
                  placeholder="请输入标签名称 (如: 素食者, VIP)"
                  className="flex-1 px-3 py-2.5 bg-[#FAF8F5] border border-[#D6CEC2] rounded-xl text-xs focus:outline-none focus:border-amber-600"
                />
                <button type="submit" className="px-5 py-2.5 bg-amber-700 text-white rounded-xl text-xs font-bold hover:bg-amber-800">确认添加</button>
              </form>
            </div>

            <div className="bg-white rounded-2xl border border-[#E8E2D5] p-5 shadow-xs space-y-4">
              <h3 className="font-bold text-base text-[#2C2A29]">现有标签列表</h3>
              <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                {tags.map(tag => (
                  <div key={tag.id} className={`p-3 rounded-xl border flex items-center justify-between text-xs font-semibold ${tag.color}`}>
                    <span className="flex items-center gap-1.5">
                      <i className="fa-solid fa-tag"></i> {tag.name}
                    </span>
                    <button onClick={() => handleDeleteTag(tag.id, tag.name)} className="p-1 text-red-600 hover:bg-white/50 rounded-lg">
                      <i className="fa-solid fa-trash-can"></i>
                    </button>
                  </div>
                ))}
              </div>
            </div>
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<TagApp />);
  </script>
</body>
</html>
