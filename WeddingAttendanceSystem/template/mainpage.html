<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>婚礼宾客签到与礼金管理系统 - 签到主页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FDFBF7] text-[#2C2A29] font-sans antialiased selection:bg-amber-100">
  <div id="root"></div>
  <script src="wedding.js"></script>
  <script type="text/babel">
    const { useState, useMemo } = React;

    function MainApp() {
      const [currentUser, setCurrentUser] = useState({ id: 'u1', username: 'staff01', name: '接待员 - 阿杰', role: 'ADMIN' });
      const [tags, setTags] = useState(INITIAL_TAGS);
      const [guests, setGuests] = useState(INITIAL_GUESTS);
      const [groups, setGroups] = useState(INITIAL_GROUPS);
      const [tables, setTables] = useState(INITIAL_TABLES);
      const [angpaoRecords, setAngpaoRecords] = useState(INITIAL_ANGPAO);

      const [searchTerm, setSearchTerm] = useState('');
      const [sideFilter, setSideFilter] = useState('ALL');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [tableFilter, setTableFilter] = useState('ALL');
      const [selectedTagFilter, setSelectedTagFilter] = useState('ALL');

      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const toggleCheckIn = (guestId) => {
        setGuests(prev => prev.map(g => {
          if (g.id === guestId) {
            const nextStatus = g.status === 'PENDING' ? 'ARRIVED' : 'PENDING';
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            showToast(nextStatus === 'ARRIVED' ? `[${g.name}] 已签到` : `已撤销 [${g.name}] 的签到`);
            return { ...g, status: nextStatus, checkInTime: nextStatus === 'ARRIVED' ? timeStr : undefined };
          }
          return g;
        }));
      };

      const checkInEntireFamily = (groupId) => {
        const group = groups.find(g => g.id === groupId);
        if (!group) return;
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        setGuests(prev => prev.map(g => {
          if (g.groupId === groupId && g.isActive && g.status === 'PENDING') {
            return { ...g, status: 'ARRIVED', checkInTime: timeStr };
          }
          return g;
        }));
        showToast(`已成功将 [${group.name}] 全员签到`);
      };

      const filteredGuests = useMemo(() => {
        return guests.filter(g => {
          if (!g.isActive) return false;
          const term = searchTerm.trim().toLowerCase();
          if (term) {
            const nameMatch = g.name.toLowerCase().includes(term);
            const groupMatch = g.groupName ? g.groupName.toLowerCase().includes(term) : false;
            const tableMatch = g.tableNumber.toLowerCase() === term || `桌${g.tableNumber}`.includes(term);
            const relMatch = g.relationship.toLowerCase().includes(term);
            if (!nameMatch && !groupMatch && !tableMatch && !relMatch) return false;
          }
          if (sideFilter !== 'ALL' && g.side !== sideFilter) return false;
          if (statusFilter !== 'ALL' && g.status !== statusFilter) return false;
          if (tableFilter !== 'ALL' && g.tableNumber !== tableFilter) return false;
          if (selectedTagFilter !== 'ALL' && (!g.tags || !g.tags.includes(selectedTagFilter))) return false;
          return true;
        });
      }, [guests, searchTerm, sideFilter, statusFilter, tableFilter, selectedTagFilter]);

      const groupedGuestItems = useMemo(() => {
        const familyMap = {};
        const standalone = [];
        filteredGuests.forEach(g => {
          if (g.groupId) {
            if (!familyMap[g.groupId]) familyMap[g.groupId] = [];
            familyMap[g.groupId].push(g);
          } else {
            standalone.push(g);
          }
        });
        return { familyMap, standalone };
      }, [filteredGuests]);

      const stats = useMemo(() => {
        const totalGuests = guests.filter(g => g.isActive).length;
        const arrivedGuests = guests.filter(g => g.isActive && g.status === 'ARRIVED').length;
        return { totalGuests, arrivedGuests };
      }, [guests]);

      return (
        <div className="min-h-screen bg-[#FDFBF7] text-[#2C2A29] font-sans flex flex-col">
          {toastMessage && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-[#322F2B] text-white text-xs md:text-sm px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 border border-amber-500/30">
              <i className="fa-solid fa-circle-check text-amber-400"></i>
              <span>{toastMessage}</span>
            </div>
          )}

          <header className="sticky top-0 z-35 bg-[#FFFDF9]/95 backdrop-blur-md border-b border-[#E8E2D5] shadow-xs">
            <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-full bg-gradient-to-br from-amber-600 to-amber-700 text-white flex items-center justify-center font-serif text-lg font-bold">囍</div>
                <div>
                  <h1 className="text-base font-bold text-[#2C2A29]">婚礼宾客签到与礼金管理系统</h1>
                  <p className="text-xs text-[#78716C]">接待员签到大厅</p>
                </div>
              </div>
              <nav className="flex items-center gap-1 bg-[#FAF7F2] p-1 rounded-xl border border-[#E8E2D5] text-xs font-semibold">
                <a href="mainpage.html" className="px-3 py-1.5 rounded-lg bg-amber-700 text-white shadow-xs">签到主页</a>
                <a href="admin/dashboard.html" className="px-3 py-1.5 rounded-lg text-[#57534E] hover:bg-[#F2ECE1]">数据看板</a>
                <a href="admin/tag.html" className="px-3 py-1.5 rounded-lg text-[#57534E] hover:bg-[#F2ECE1]">标签管理</a>
                <a href="admin/add-guest.html" className="px-3 py-1.5 rounded-lg text-[#57534E] hover:bg-[#F2ECE1]">新增宾客</a>
                <a href="admin/table-setting.html" className="px-3 py-1.5 rounded-lg text-[#57534E] hover:bg-[#F2ECE1]">桌位设置</a>
              </nav>
            </div>
          </header>

          <main className="flex-1 max-w-4xl w-full mx-auto p-3 md:p-6 space-y-4">
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-[#E8E2D5] space-y-3">
              <div className="grid grid-cols-2 gap-2 pb-1 border-b border-[#F0EBE1] text-center">
                <div className="bg-emerald-50/70 p-2.5 rounded-xl border border-emerald-100 flex flex-col items-center justify-center">
                  <span className="text-emerald-800 text-[11px] font-medium">全场出席进度</span>
                  <span className="text-lg md:text-xl font-extrabold text-emerald-900 mt-0.5">{stats.arrivedGuests} / {stats.totalGuests} 人</span>
                </div>
                <div className="bg-amber-50/70 p-2.5 rounded-xl border border-amber-100 flex flex-col items-center justify-center">
                  <span className="text-amber-800 text-[11px] font-medium">快捷导航</span>
                  <a href="admin/dashboard.html" className="text-xs font-bold text-amber-900 underline mt-1">进入后台查看礼金统计 &rarr;</a>
                </div>
              </div>

              <div className="relative">
                <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-amber-700/60"></i>
                <input
                  type="text"
                  value={searchTerm}
                  onChange={e => setSearchTerm(e.target.value)}
                  placeholder="搜索宾客姓名 / 家庭名称 / 桌号 (如: 张伟, 03)"
                  className="w-full pl-11 pr-10 py-3 bg-[#FAF8F5] border-2 border-[#E0D8C8] focus:border-amber-600 rounded-xl text-base focus:outline-none"
                />
              </div>

              <div className="flex flex-wrap items-center gap-2 pt-1 text-xs">
                <div className="inline-flex rounded-lg bg-[#FAF7F2] p-0.5 border border-[#E8E2D5]">
                  <button onClick={() => setSideFilter('ALL')} className={`px-2.5 py-1 rounded-md ${sideFilter === 'ALL' ? 'bg-white shadow-xs font-bold' : 'text-[#78716C]'}`}>全部</button>
                  <button onClick={() => setSideFilter('GROOM')} className={`px-2.5 py-1 rounded-md ${sideFilter === 'GROOM' ? 'bg-blue-600 text-white shadow-xs font-bold' : 'text-[#78716C]'}`}>男方</button>
                  <button onClick={() => setSideFilter('BRIDE')} className={`px-2.5 py-1 rounded-md ${sideFilter === 'BRIDE' ? 'bg-rose-600 text-white shadow-xs font-bold' : 'text-[#78716C]'}`}>女方</button>
                </div>

                <div className="inline-flex rounded-lg bg-[#FAF7F2] p-0.5 border border-[#E8E2D5]">
                  <button onClick={() => setStatusFilter('ALL')} className={`px-2.5 py-1 rounded-md ${statusFilter === 'ALL' ? 'bg-white shadow-xs font-bold' : 'text-[#78716C]'}`}>全部状态</button>
                  <button onClick={() => setStatusFilter('PENDING')} className={`px-2.5 py-1 rounded-md ${statusFilter === 'PENDING' ? 'bg-amber-600 text-white shadow-xs font-bold' : 'text-[#78716C]'}`}>未到</button>
                  <button onClick={() => setStatusFilter('ARRIVED')} className={`px-2.5 py-1 rounded-md ${statusFilter === 'ARRIVED' ? 'bg-emerald-600 text-white shadow-xs font-bold' : 'text-[#78716C]'}`}>已到</button>
                </div>

                <select value={tableFilter} onChange={e => setTableFilter(e.target.value)} className="bg-[#FAF7F2] border border-[#E8E2D5] rounded-lg px-2.5 py-1 text-[#57534E]">
                  <option value="ALL">所有桌号</option>
                  {tables.map(t => <option key={t.id} value={t.number}>{t.number} 桌</option>)}
                </select>

                <select value={selectedTagFilter} onChange={e => setSelectedTagFilter(e.target.value)} className="bg-[#FAF7F2] border border-[#E8E2D5] rounded-lg px-2.5 py-1 text-[#57534E]">
                  <option value="ALL">全部标签</option>
                  {tags.map(tag => <option key={tag.id} value={tag.id}>🏷️ {tag.name}</option>)}
                </select>
              </div>
            </div>

            <div className="space-y-3">
              {filteredGuests.length === 0 ? (
                <div className="bg-white rounded-2xl p-8 text-center border border-[#E8E2D5]">
                  <p className="text-sm text-[#78716C]">未找到匹配的宾客</p>
                </div>
              ) : (
                <>
                  {Object.entries(groupedGuestItems.familyMap).map(([groupId, groupGuests]) => {
                    const groupInfo = groups.find(g => g.id === groupId);
                    if (!groupInfo) return null;
                    const arrivedCount = groupGuests.filter(g => g.status === 'ARRIVED').length;
                    return (
                      <div key={groupId} className="bg-white rounded-2xl border-2 border-[#E5DFD3] shadow-xs overflow-hidden">
                        <div className="bg-gradient-to-r from-[#FAF6EE] to-[#F5EFE3] p-3.5 border-b border-[#E8E2D5] flex items-center justify-between">
                          <div>
                            <div className="flex items-center gap-2">
                              <h3 className="text-base font-bold text-[#2C2A29]">{groupInfo.name}</h3>
                              <span className="text-[10px] px-2 py-0.5 rounded-full font-semibold bg-blue-100 text-blue-800">家庭组</span>
                            </div>
                            <p className="text-xs text-[#78716C] mt-0.5">桌号: {groupInfo.tableNumbers.join(', ')} 桌 | 已到: {arrivedCount}/{groupGuests.length}</p>
                          </div>
                          <button onClick={() => checkInEntireFamily(groupId)} className="px-3 py-1.5 bg-emerald-700 text-white rounded-lg text-xs font-semibold">全家一键签到</button>
                        </div>
                        <div className="p-3 space-y-2">
                          {groupGuests.map(guest => (
                            <div key={guest.id} className={`p-3 rounded-xl border flex items-center justify-between ${guest.status === 'ARRIVED' ? 'bg-emerald-50/40 border-emerald-200' : 'bg-white border-[#E8E2D5]'}`}>
                              <div>
                                <h4 className="text-sm font-bold">{guest.name} <span className="text-xs font-normal text-[#78716C]">({guest.relationship})</span></h4>
                                <p className="text-xs text-[#78716C]">桌号: {guest.tableNumber} 桌</p>
                              </div>
                              <button onClick={() => toggleCheckIn(guest.id)} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${guest.status === 'ARRIVED' ? 'bg-white border border-emerald-300 text-emerald-800' : 'bg-amber-700 text-white'}`}>
                                {guest.status === 'ARRIVED' ? '已签到 (撤销)' : '立即签导'}
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}

                  {groupedGuestItems.standalone.map(guest => (
                    <div key={guest.id} className={`p-3 rounded-xl border flex items-center justify-between bg-white border-[#E8E2D5] shadow-xs`}>
                      <div>
                        <h4 className="text-sm font-bold">{guest.name} <span className="text-xs font-normal text-[#78716C]">({guest.relationship})</span></h4>
                        <p className="text-xs text-[#78716C]">桌号: {guest.tableNumber} 桌</p>
                      </div>
                      <button onClick={() => toggleCheckIn(guest.id)} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${guest.status === 'ARRIVED' ? 'bg-white border border-emerald-300 text-emerald-800' : 'bg-amber-700 text-white'}`}>
                        {guest.status === 'ARRIVED' ? '已签到 (撤销)' : '立即签到'}
                      </button>
                    </div>
                  ))}
                </>
              )}
            </div>
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
  </script>
</body>
</html>
